; PlatformIO project — Makerfabs ESP32 UWB Pro with Display
; Distance measurement: tag (mobile) + anchor (fixed)
;
; Build a specific board:
;   pio run -e tag
;   pio run -e anchor
;
; Upload a specific board:
;   pio run -e tag -t upload
;   pio run -e anchor -t upload
;
; Monitor:
;   pio device monitor -e tag -b 115200

[platformio]
default_envs = tag
src_dir = src
lib_dir = lib

[env]
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.16
    adafruit/Adafruit GFX Library @ ^1.12.6
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:tag]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<tag/*>

[env:anchor]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<anchor/*>