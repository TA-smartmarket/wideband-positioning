; PlatformIO project — Makerfabs ESP32 UWB Pro with Display
; Distance measurement: tag (mobile) + anchor (fixed)
;
; Build a specific board:
;   pio run -e tag
;   pio run -e anchor
;   pio run -e anchor2        (second anchor, unique UWB address)
;
; Upload a specific board:
;   pio run -e tag -t upload
;   pio run -e anchor -t upload
;   pio run -e anchor2 -t upload --upload-port COM11
;
; Monitor:
;   pio device monitor -e tag -b 115200

[platformio]
default_envs = tag
src_dir = src
lib_dir = lib

[env]
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.16
    adafruit/Adafruit GFX Library @ ^1.12.6
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:tag]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<tag/*>

[env:anchor]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<anchor/*>

; Second anchor board - unique UWB address (first two bytes -> short
; address 0x3D4E, different from anchor 0x8617).
; NOTE: env-specific build_flags REPLACE the [env] block, so the USB
; flags must be repeated here.
[env:anchor2]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<anchor/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DANCHOR_EUI=\"3D:4E:7C:2A:08:5F:B1:C3\"