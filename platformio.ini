; PlatformIO — ESP32 UWB positioning (Makerfabs ESP32 UWB Pro with Display)
;
; ONE firmware for every board. Role (tag/anchor) and ID are chosen at
; runtime and stored in NVS — no per-board environments, no recompiling.
;
;   pio run                      build
;   pio run -t upload            flash
;   pio device monitor           serial menu ('?' for help)
;
; Server (REST + MQTT + web UI): see server/README.md

[platformio]
default_envs = esp32uwb

[env:esp32uwb]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; WiFi + HTTP + MQTT + JSON do not fit in the default 1.3 MB app slot
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.16
    adafruit/Adafruit GFX Library @ ^1.12.6
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0